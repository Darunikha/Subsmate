# Render Blueprint: one service serves both the API and the web app.
# In Render: New + > Blueprint > pick this repo > Apply.
services:
  - type: web
    name: subsmate
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Render creates a random secret for you
      - key: SEED_DEMO_DATA
        value: "true"            # demo data (and demo logins) on a fresh database
