groups:
  - name: subsmate
    rules:
      - alert: SubsmateBackendDown
        expr: up{job="subsmate-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Subsmate backend is not responding to Prometheus scrapes.

      - alert: SubsmateHighErrorRate
        expr: |
          sum(rate(subsmate_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(subsmate_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests are failing with 5xx errors.

      - alert: SubsmateExpiredSubscriptionsGrowing
        expr: subsmate_subscriptions{status="expired"} > 10
        for: 1h
        labels: { severity: info }
        annotations:
          summary: More than 10 subscriptions are expired and awaiting renewal.
